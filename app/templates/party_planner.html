{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">PLANNER 02</span><h1>Party Budget Planner</h1><p>Balance food, venue and decoration around your guest count.</p></section><form id="partyForm" class="card planner-form"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Guest count<input type="number" name="guest_count" min="1" required></label><label>Event type<input name="event_type" required placeholder="Birthday"></label><label>Venue type<input name="venue_type" value="indoor"></label><label>City<input name="city" placeholder="Coimbatore"></label><label>Notes<textarea name="notes"></textarea></label><button class="button">Generate Party Plan</button><div id="formMessage" class="message"></div></form>{% endblock %}{% block scripts %}<script>document.getElementById('partyForm').addEventListener('submit',async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.budget=+b.budget;b.guest_count=+b.guest_count;let r=await api('/api/generate-party',{method:'POST',body:b});if(r.ok){sessionStorage.lastRecommendation=JSON.stringify(r.data);location='/recommendations'}else document.getElementById('formMessage').textContent=r.data.detail||'Unable to generate plan'});</script>{% endblock %}
