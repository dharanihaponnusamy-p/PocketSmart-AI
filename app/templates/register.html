{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<section class="form-wrap"><form id="registerForm" class="form-card"><h1>Create your account</h1><p>Save your AI planning history.</p><label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="button">Register</button><div id="formMessage" class="message"></div><p>Already registered? <a href="/login">Login</a></p></form></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();let r=await api('/api/register',{method:'POST',body:Object.fromEntries(new FormData(e.target))});if(r.ok)location='/dashboard';else document.getElementById('formMessage').textContent=r.data.detail||'Registration failed';});</script>{% endblock %}
