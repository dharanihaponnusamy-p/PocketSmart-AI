{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">HISTORY</span><h1>Your Recommendation History</h1><p>Review your recent generated plans.</p></section><div id="historyList" class="results-list"></div>{% endblock %}{% block scripts %}<script>(async()=>{let r=await api('/api/history'),box=document.getElementById('historyList');if(!r.ok){box.innerHTML=`<section class="card"><p>${escapeHtml(r.data.detail||'Unable to load history')}</p></section>`;return}if(!r.data.length){box.innerHTML='<section class="card"><h2>No history yet</h2></section>';return}box.innerHTML=r.data.map(row=>`<article class="result-card"><div><span class="tag">${escapeHtml(row.planner)}</span><h3>Budget ₹${(+row.budget).toLocaleString('en-IN')}</h3><p>${escapeHtml(row.result.summary||'')}</p><small>${new Date(row.created_at).toLocaleString()}</small></div><button class="button small" onclick='viewHistory(${JSON.stringify(row.result).replaceAll("'","&#39;")})'>View</button></article>`).join('')})();function viewHistory(r){sessionStorage.lastRecommendation=JSON.stringify(r);location='/recommendations'}</script>{% endblock %}
