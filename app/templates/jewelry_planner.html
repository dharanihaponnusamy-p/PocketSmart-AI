{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">PLANNER 03</span><h1>Jewelry Budget Planner</h1><p>Choose an occasion and style. Optionally add an outfit image.</p></section><form id="jewelryForm" class="card planner-form" enctype="multipart/form-data"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Occasion<input name="occasion" required placeholder="Wedding"></label><label>Style<input name="style" value="classic"></label><label>Outfit image (optional)<input type="file" name="outfit_image" accept="image/jpeg,image/png,image/webp"></label><label>Notes<textarea name="notes"></textarea></label><button class="button">Generate Jewelry Plan</button><div id="formMessage" class="message"></div></form>{% endblock %}{% block scripts %}<script>document.getElementById('jewelryForm').addEventListener('submit',async e=>{e.preventDefault();let r=await api('/api/generate-jewelry',{method:'POST',body:new FormData(e.target)});if(r.ok){sessionStorage.lastRecommendation=JSON.stringify(r.data);location='/recommendations'}else document.getElementById('formMessage').textContent=r.data.detail||'Unable to generate plan'});</script>{% endblock %}
