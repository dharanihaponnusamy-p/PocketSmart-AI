{% extends "base.html" %}{% block title %}Recommendations{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">RESULT</span><h1>Your PocketSmart Plan</h1><p id="resultMode"></p></section><div id="recommendation"></div>{% endblock %}{% block scripts %}<script>function renderRecommendation(d){document.getElementById('resultMode').textContent=(d.ai_powered?'Generated with Gemini AI':'Local fallback mode')+` · Budget ₹${(+d.budget).toLocaleString('en-IN')}`;let items=(d.items||[]).map(i=>`<article class="result-card"><div><span class="tag">${escapeHtml(i.category)}</span><h3>${escapeHtml(i.name)}</h3><p>${escapeHtml(i.reason)}</p><small>${escapeHtml(i.platform)} · estimated ₹${(+i.estimated_price).toLocaleString('en-IN')} × ${i.quantity}</small></div><a class="button small" target="_blank" rel="noopener" href="${i.search_url}">Search</a></article>`).join('');let tips=(d.tips||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join('');document.getElementById('recommendation').innerHTML=`<section class="summary-card"><h2>${escapeHtml(d.summary)}</h2><div class="budget-line"><span>Allocated: ₹${(+d.allocated_total).toLocaleString('en-IN')}</span><span>Remaining: ₹${(+d.remaining).toLocaleString('en-IN')}</span></div><p>${escapeHtml(d.source_note)}</p></section><section class="results-list">${items}</section><section class="card"><h2>Planning tips</h2><ul>${tips}</ul></section>`}let x=sessionStorage.getItem('lastRecommendation');if(x)renderRecommendation(JSON.parse(x));else document.getElementById('recommendation').innerHTML='<section class="card"><h2>No recent recommendation</h2><p>Open a planner to create one.</p></section>';</script>{% endblock %}
