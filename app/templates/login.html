{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<section class="form-wrap"><form id="loginForm" class="form-card"><h1>Welcome back</h1><p>Login to use planners and save history.</p><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="button">Login</button><div id="formMessage" class="message"></div><p>New here? <a href="/register">Create an account</a></p></form></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let r=await api('/api/login',{method:'POST',body:Object.fromEntries(new FormData(e.target))});if(r.ok)location='/dashboard';else document.getElementById('formMessage').textContent=r.data.detail||'Login failed';});</script>{% endblock %}
