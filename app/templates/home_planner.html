{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">PLANNER 01</span><h1>Home Interior Budget Planner</h1><p>Enter rooms, budget and style.</p></section><form id="homeForm" class="card planner-form"><label>Total budget (₹)<input type="number" name="budget" min="1" required></label><label>Style<input name="style" value="modern"></label><label>Notes<textarea name="notes"></textarea></label><h3>Rooms</h3><div id="rooms"><div class="room-row"><input name="room_type" value="Living Room" required><input type="number" name="quantity" value="1" min="1" required></div></div><button type="button" class="button secondary" onclick="addRoom()">+ Add room</button><button class="button">Generate Home Plan</button><div id="formMessage" class="message"></div></form>{% endblock %}{% block scripts %}<script>function addRoom(){let d=document.createElement('div');d.className='room-row';d.innerHTML='<input name="room_type" placeholder="Bedroom" required><input type="number" name="quantity" value="1" min="1" required>';document.getElementById('rooms').appendChild(d)}document.getElementById('homeForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),t=f.getAll('room_type'),q=f.getAll('quantity'),b={budget:+f.get('budget'),style:f.get('style'),notes:f.get('notes'),rooms:t.map((x,i)=>({room_type:x,quantity:+q[i]}))};let r=await api('/api/generate-home',{method:'POST',body:b});if(r.ok){sessionStorage.lastRecommendation=JSON.stringify(r.data);location='/recommendations'}else document.getElementById('formMessage').textContent=r.data.detail||'Unable to generate plan'});</script>{% endblock %}
